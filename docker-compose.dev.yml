services:
  app:
    build:
      context: .
      target: dev
    container_name: app
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next-runtime
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: "haushaltsbuch@local.test"
      CYPRESS_INSTALL_BINARY: "0"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - kuzu-network

  db:
    image: postgres:15
    container_name: db
    restart: unless-stopped
    ports:
      - "5678:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kuzu-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    networks:
      - kuzu-network
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  pgdata:

networks:
  kuzu-network:
    driver: bridge
